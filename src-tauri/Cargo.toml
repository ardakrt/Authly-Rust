[package]
name = "authly"
version = "0.3.13"
description = "Cross-platform, offline desktop authenticator for Windows and Linux"
authors = ["Arda Kartal <ardakartaskisisel@gmail.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "authly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
data-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
rfd = "0.15"
arboard = "3"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
